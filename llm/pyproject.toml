[project]
name = "afrilearner360-llm"
version = "0.1.0"
description = "LLM/AI component of AfriLearner360: assessment item generation, student profiling, classroom clustering, and teaching recommendations"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afrilearner360_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
