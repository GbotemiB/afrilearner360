# Locale configuration for Rwanda (public primary school pilot context).
# Referenced by both the assessment item-generation pipeline and the recommendation-generation
# pipeline so both stages stay consistent for a given deployment. See
# data/cultural_knowledge_base/rwanda.md for the source material this is built from.

locale: rwanda
display_name: "Rwanda (public primary school)"

# Trait definitions shown to the LLM so it understands what each mode measures.
trait_definitions:
  visual: "Learning through pictures, diagrams, colors, patterns, and visual demonstration"
  game: "Learning through play, competition, challenges, and interactive activities"
  structured: "Learning through clear steps, rules, sequences, and organized procedures"
  story: "Learning through narrative, characters, and storytelling"

# Assessment item-generation settings.
assessment:
  point_budget: 10          # points a student splits across the 4 options per item

  # Number of items in one student's assessment. Every student in a class answers the SAME items:
  # sampling different items per student would make k-means cluster partly on which items a
  # student happened to get rather than on their traits (the differential-item-functioning risk
  # in DESIGN.md §4.3).
  #
  # 10 chosen for resolution: each item allocates `point_budget` points, so N items give 10N total
  # and one point moves a trait proportion by 10/N percentage points. At 10 items that is 1.0pp,
  # which sits comfortably under the 12pp balanced / 15pp secondary thresholds the profiler uses.
  # At 3 items it would be 3.3pp and profiles would be too coarse for those thresholds to mean
  # much.
  items_per_assessment: 10

  knowledge_base_path: "data/cultural_knowledge_base/rwanda.md"

  # The LLM always drafts items in this language, regardless of grade band. Free-tier models
  # produce structurally correct but linguistically broken Kinyarwanda (real example in
  # DESIGN.md §7: a model redefined "amashirahamwe" -- associations/cooperatives -- to mean
  # "patterns"), so Kinyarwanda is produced by a human translator inside the review gate rather
  # than by the model.
  generation_language: english

  # Language each grade band's items must be DELIVERED to students in. Where this differs from
  # generation_language, a human translation step is required before the item can go live.
  #
  # Both bands are English for MVP. Lower primary was originally kinyarwanda -- only 38% of
  # lower-primary students read grade-level English -- but that required a human translation pass
  # per item, which blocked P1-P3 entirely (no free model writes usable Kinyarwanda; DESIGN.md §7).
  #
  # This is only sound if P1-P3 items are ADMINISTERED ORALLY, with the teacher rendering them in
  # Kinyarwanda as they read. Handed to a 7-year-old as text, it measures English reading ability
  # rather than engagement preference. See DESIGN.md §4.1 and §6.
  delivery_language_by_grade_band:
    lower_primary: english       # P1-P3 -- assumes teacher-mediated oral administration
    upper_primary: english       # P4-P6

# Recommendation-generation context (feeds the LLM prompt at the recommendation stage).
recommendation_context:
  pupil_teacher_ratio: "44:1 nationally (2021), up to 120:1 in some areas; P1-P2 classes reach 73:1-78:1"
  double_shift_schools_pct: 64
  instructional_hours_per_week: "~22 in double-shift schools vs. ~42 in single-shift schools"
  ict_assumption: "assume low/no per-student device access; design around chalkboard + shared textbooks"
  pedagogical_norms: "more communal/group-oriented instructional norms than individualized-learner framing; cluster-level recommendations fit naturally"
  language_note: "~90% of primary students can't read grade-level English text despite English being the nominal instructional language since 2008 -- prefer Kinyarwanda for lower-primary communication"

# Known limitation: this file is built from internet research, not live local teacher/student
# interviews. A local-teacher review pass is recommended before real deployment.
